<section class="ip-asset-form">
	<h3>{{ heading }}</h3>

	<div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

	<form [formGroup]="form" (ngSubmit)="onSubmit()">
		<label for="internalReference">Internal Reference</label>
		<input
			id="internalReference"
			formControlName="internalReference"
			placeholder="e.g. ip-123"
		/>

		<label for="clientId">Client</label>
		<select id="clientId" formControlName="clientId">
			<option value="">Select a client</option>
			<option *ngFor="let client of clients" [value]="client.Id">
				{{ client.Name }}
			</option>
		</select>

		<label for="title">Title</label>
		<input
			id="title"
			formControlName="title"
			placeholder="Patent or trade mark title"
		/>

		<label for="description">Description</label>
		<textarea
			id="description"
			formControlName="description"
			rows="2"
		></textarea>

		<label for="type">Type</label>
		<select id="type" formControlName="type">
			<option value="Unknown">Unknown</option>
			<option value="Patent">Patent</option>
			<option value="TradeMark">Trade Mark</option>
		</select>

		<button type="submit" [disabled]="busy">{{ submitLabel }}</button>
		<button type="button" (click)="onCancel()" [disabled]="busy">
			{{ isEdit ? "Cancel" : "Clear" }}
		</button>
	</form>
</section>
