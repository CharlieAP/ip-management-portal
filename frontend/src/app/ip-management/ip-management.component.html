<div>
	<h2>IP Management</h2>

	<div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

	<app-ip-asset-form
		[clients]="clientOptions"
		[initialValue]="editing"
		[busy]="busy"
		[errorMessage]="formErrorMessage"
		(save)="onSave($event)"
		(cancel)="onCancelEdit()"
	></app-ip-asset-form>

	<section>
		<h3>Your IP Entries</h3>
		<table *ngIf="ipEntries.length; else emptyState">
			<thead>
				<tr>
					<th>Internal Reference</th>
					<th>Title</th>
					<th>Client</th>
					<th>Type</th>
					<th>Description</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr *ngFor="let entry of ipEntries">
					<td>{{ entry.InternalReference }}</td>
					<td>{{ entry.Title }}</td>
					<td>{{ getClientName(entry.ClientId) }}</td>
					<td>{{ getIpType(entry.Type) }}</td>
					<td>{{ entry.Description }}</td>
					<td>
						<button (click)="onEdit(entry)">Edit</button>
						<button (click)="onDelete(entry)">Delete</button>
					</td>
				</tr>
			</tbody>
		</table>

		<ng-template #emptyState>
			<p>No IP entries found for your clients.</p>
		</ng-template>
	</section>
</div>
